name: KyarasuCI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      # Backend
      - name: Install backend
        run: |
          cd Backend
          npm install

      - name: Run backend tests
        run: |
          cd Backend
          npm ci
          npm test -- Test
